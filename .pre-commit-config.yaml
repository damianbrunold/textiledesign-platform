# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Update the pinned revisions with `pre-commit autoupdate`.
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
        # Bundled export fonts (CJK fallback is ~4 MB).
        exclude: ^src/textileplatform/static/fonts/
# pre-commit/mirrors-autopep8 is archived; autopep8 ships its own hook.
-   repo: https://github.com/hhatto/autopep8
    rev: v2.3.2
    hooks:
    -   id: autopep8
        # Autogenerated migrations and the video scripts' helper are
        # left as written.
        exclude: ^(migrations/versions|docs)/
-   repo: https://github.com/pycqa/flake8
    rev: '7.5.0'
    hooks:
    -   id: flake8
        exclude: ^(migrations/versions|docs)/
