# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Update the pinned revisions with `pre-commit autoupdate`.
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        # Desktop sample files are test data, kept byte for byte.
        exclude: ^tests/data/
    -   id: end-of-file-fixer
        # Desktop sample files are test data, kept byte for byte.
        exclude: ^tests/data/
    -   id: check-yaml
    -   id: check-added-large-files
        # Bundled export fonts (CJK fallback is ~4 MB).
        exclude: ^src/textileplatform/static/fonts/
# pre-commit/mirrors-autopep8 is archived; autopep8 ships its own hook.
-   repo: https://github.com/hhatto/autopep8
    rev: v2.3.2
    hooks:
    -   id: autopep8
        # Autogenerated migrations and the video scripts' helper are
        # left as written.
        exclude: ^(migrations/versions|docs)/
# Linting (configured in pyproject.toml, which also sets the excludes).
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
    -   id: ruff-check
# ESLint for the editors' JavaScript (needs Node and `npm install`).
-   repo: local
    hooks:
    -   id: eslint
        name: eslint
        entry: node node_modules/eslint/bin/eslint.js
        language: system
        types: [javascript]
        exclude: ^docs/
