[project]
name = "textileplatform"
version = "1.0.59"
description = "Textile Plattform Webapp"
authors = [
    {name="Damian Brunold", email="dab@dabsoft.ch"}
]
requires-python = ">=3.12"

# Runtime dependencies. Lower bounds carry the security fixes we rely on;
# exact versions for deployment are pinned in requirements.txt.
dependencies = [
    "flask>=3.1.3",
    "werkzeug>=3.1.9",
    "jinja2>=3.1.6",
    "click>=8.1",
    "flask-babel>=4.0",
    "babel>=2.16",
    "flask-limiter>=4.0",
    "flask-migrate>=4.0",
    "flask-sqlalchemy>=3.1",
    "sqlalchemy>=2.0",
    "flask-wtf>=1.2",
    "python-dotenv>=1.0",
    "psycopg>=3.2",
    "pytz",
    "reportlab>=4.2",
    "Pillow>=11.0",
    "psutil>=6.0",
    # Arabic / Hebrew text in PDF and image exports.
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-playwright>=0.7",
    "hypothesis>=6.100",
    "ruff>=0.15",
    "pip-audit>=2.9",
    "autopep8>=2",
    "pre-commit>=4",
    "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:textileplatform"]
markers = ["e2e: browser end-to-end test (Playwright, tests/e2e)"]

[tool.coverage.run]
source = ["textileplatform"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true

# Linting only; formatting stays with autopep8 (ruff format would rewrite
# most files).
[tool.ruff]
line-length = 79
extend-exclude = ["migrations/versions", "docs"]
# Apply the excludes to files pre-commit passes explicitly, too.
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes (what flake8 checked)
    "B",            # bugbear: likely bugs
    "C4",           # comprehensions
    "PIE",          # misc. lints
    "UP",           # pyupgrade
    "SIM",          # simplifications
    "PT",           # pytest style
    "RUF",          # ruff-specific
    "PLE", "PLW",   # pylint errors / warnings
    "S",            # bandit security checks
    "DTZ",          # naive datetimes
]
ignore = [
    "B905",     # zip() without strict=: our zips pair equal-length lists
    "RUF001", "RUF002", "RUF003",  # "×" in text and comments is intended
    "SIM105",   # contextlib.suppress over try/except/pass: taste
    "SIM108",   # ternary over if/else: taste
    "PLW0603",  # module-level caches use `global`
    "PLW2901",  # rebinding a loop variable while normalising it
    "S110", "S112",  # best-effort try/except/pass (sysinfo, cleanup)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",                  # assert
    "S105", "S106", "S107",  # test passwords
    "S311",                  # non-crypto random
    "S314",                  # parsing our own SVG output
]
# The noqa: E402 comments stop autopep8 from hoisting the imports above
# the environment setup; ruff itself allows imports after it.
"tests/conftest.py" = ["RUF100"]
"{deploy_to_server,update_server}.py" = ["S603", "S607"]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
