[project]
name = "textileplatform"
version = "1.0.57"
description = "Textile Plattform Webapp"
authors = [
    {name="Damian Brunold", email="dab@dabsoft.ch"}
]
requires-python = ">=3.12"

# Runtime dependencies. Lower bounds carry the security fixes we rely on;
# exact versions for deployment are pinned in requirements.txt.
dependencies = [
    "flask>=3.1.3",
    "werkzeug>=3.1.9",
    "jinja2>=3.1.6",
    "click>=8.1",
    "flask-babel>=4.0",
    "babel>=2.16",
    "flask-limiter>=4.0",
    "flask-migrate>=4.0",
    "flask-sqlalchemy>=3.1",
    "sqlalchemy>=2.0",
    "flask-wtf>=1.2",
    "python-dotenv>=1.0",
    "psycopg>=3.2",
    "pytz",
    "reportlab>=4.2",
    "Pillow>=11.0",
    "psutil>=6.0",
    # Arabic / Hebrew text in PDF and image exports.
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "flake8>=7",
    "autopep8>=2",
    "pre-commit>=4",
    "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:textileplatform"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
